name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ci-public-linux-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # `fmt` is intentionally not a CI gate: it is auto-fixable, would only fail
      # after a merge if run on main-push, and requires a nightly toolchain just
      # for rustfmt.toml's nightly-only import grouping. Run it locally with
      # `cargo flux run fmt`. Everything below runs on stable.
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
          linux-dependencies: build
          cache-shared-key: quality-v1
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}

      - name: Check for cargo-binstall
        id: cargo-binstall
        shell: bash
        run: |
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-binstall
        if: steps.cargo-binstall.outputs.available != 'true'
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: "1.21.1"
      - name: Install or update cargo-flux
        run: cargo binstall cargo-flux --no-confirm --force
      - run: cargo flux run check
      - run: cargo flux run check-wasm
      - run: cargo flux run check-wasm-features
      - run: cargo flux run lint
      - run: cargo flux run test
      - name: Verify hyphae-gpui is publishable
        run: cargo publish --dry-run --locked --allow-dirty -p hyphae-gpui
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()

[channels]
main = "production"

# `--all-features` so the feature-gated modules (scheduler, profiling, async)
# are actually compiled/linted/tested — with `default = []` a bare cargo
# invocation skips most of the crate. No `--all-targets`: that pulls in the
# benches, which are slow to build and are not a correctness gate.

[tasks.check]
cargo = ["cargo", "check", "--all-features"]
workspace_batchable = true

# Wasm compile guard for the crates that ship into wasm apps (rship's Tauri UI):
# the core `hyphae` crate (the scheduler clock/platform seam), plus the
# `hyphae-leptos` and `hyphae-gpui` UI bridges. Opted into per-crate via
# `[package.metadata.flux]`.
[tasks.check-wasm]
cargo = ["cargo", "check", "--target", "wasm32-unknown-unknown"]
workspace_batchable = true

# Wasm compile guard for the *feature-gated* modules. `check-wasm` alone
# compiles `default = []` and skips them — that gap shipped 1.3.2 with an
# ungated `rayon` reference in the scheduler that broke every downstream wasm
# build with `scheduler` enabled. Every feature must stay wasm-clean; only
# `hyphae` opts in — `hyphae-leptos` doesn't define these features.
[tasks.check-wasm-features]
cargo = [
    "cargo",
    "check",
    "--target",
    "wasm32-unknown-unknown",
    "--features",
    "scheduler,async,profiling,local-runtime",
]
workspace_batchable = true

[tasks.build]
cargo = ["cargo", "build", "--locked"]
workspace_batchable = true

# Formatting is the only task that needs nightly: `group_imports` /
# `imports_granularity` in rustfmt.toml are still nightly-only. Per-crate
# batchable like the rest — each package formats itself in parallel. Every other
# task stays on stable; CI installs a nightly toolchain solely for this check.
[tasks.fmt]
cargo = ["cargo", "+nightly", "fmt", "--check"]
workspace_batchable = true

[tasks.test]
cargo = ["cargo", "test", "--all-features"]
workspace_batchable = true

# `--tests` (the test targets recompile the lib/bin under cfg(test), so this
# lints both the library code and the test code) — no benches, and robust on the
# bin-only crate.
[tasks.lint]
cargo = ["cargo", "clippy", "--tests", "--all-features", "--", "-D", "warnings"]

[tasks.publish]
cascade = "all"
autoapply = "inherit"
depends_on = ["build"]
cargo = ["cargo", "publish", "--locked"]

# Focus the core runtime without compiling platform UI adapters.
[tasks.test-core]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "--", "--test-threads=1"]

[tasks.lint-core]
root = ["cargo", "clippy", "-p", "hyphae", "--tests", "--all-features", "--", "-D", "warnings"]

[tasks.fmt-map-storage]
root = ["rustfmt", "+nightly", "--edition", "2024", "--check", "hyphae/src/cell_map/mutation.rs"]

[tasks.test-map-reentrant]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "cell_map::tests::key_observers_can_observe_colliding_keys_during_every_mutation", "--", "--exact", "--test-threads=1"]

[tasks.format-map-storage]
root = ["rustfmt", "+nightly", "--edition", "2024", "hyphae/src/cell_map/mutation.rs", "hyphae/src/cell_map/tests.rs"]

[tasks.test-fanout-order]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "--test", "concurrent_fanout_order", "--", "--ignored", "--test-threads=1"]

[tasks.test-equality-cutoff]
root = ["env", "HYPHAE_EQ_CUTOFF=1", "cargo", "test", "-p", "hyphae", "--all-features", "--test", "equality_cutoff", "--", "--test-threads=1"]

[tasks.test-pair-join-delta]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "--test", "pair_join_delta", "--", "--test-threads=1", "--nocapture"]

[tasks.format-pair-join-delta]
root = ["rustfmt", "+nightly", "--edition", "2024", "--config", "skip_children=true", "hyphae/tests/pair_join_delta.rs", "hyphae/src/traits/collections/inner_join.rs", "hyphae/src/traits/collections/internal/join_runtime.rs", "hyphae/src/traits/collections/internal/join_runtime/pair.rs"]

[tasks.check-core-default]
root = ["cargo", "check", "-p", "hyphae", "--no-default-features"]

[tasks.check-pair-join-wasm]
root = ["cargo", "check", "-p", "hyphae", "--target", "wasm32-unknown-unknown", "--features", "scheduler,async,profiling,local-runtime"]

[tasks.test-pair-join-scratch]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "initial_join_does_not_retain_large_touched_scratch", "--", "--test-threads=1", "--nocapture"]

[tasks.test-ordered-set]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "ordered_set::tests", "--", "--test-threads=1", "--nocapture"]

[tasks.format-query-storage]
root = ["rustfmt", "+nightly", "--edition", "2024", "--config", "skip_children=true", "hyphae/src/traits/collections/internal/ordered_set.rs", "hyphae/src/traits/collections/internal/join_runtime/pair.rs", "hyphae/src/traits/collections/internal/map_runtime.rs"]

[tasks.format-single-runtime]
root = ["rustfmt", "+nightly", "--edition", "2024", "--config", "skip_children=true", "hyphae/src/traits/collections/project.rs", "hyphae/src/traits/collections/internal/mod.rs", "hyphae/src/traits/collections/internal/single_runtime.rs", "hyphae/src/traits/collections/internal/map_runtime.rs"]

[tasks.format-diff-batch]
root = ["rustfmt", "+nightly", "--edition", "2024", "--config", "skip_children=true", "hyphae/src/cell.rs", "hyphae/src/cell_map.rs", "hyphae/src/cell_map/mutation.rs", "hyphae/src/cell_map/tests.rs", "hyphae/tests/cell_map_batched_diff_length.rs", "hyphae/tests/scheduler_no_coalesce.rs"]

[tasks.test-diff-batch]
root = ["env", "HYPHAE_BATCH_MAP_DIFFS=1", "cargo", "test", "-p", "hyphae", "--all-features", "--", "--test-threads=1"]

[tasks.test-diff-batch-integrations]
root = ["env", "HYPHAE_BATCH_MAP_DIFFS=1", "cargo", "test", "-p", "hyphae", "--all-features", "--test", "*", "--", "--test-threads=1"]

[tasks.test-diff-batch-focused]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "diff_batch_", "--", "--test-threads=1"]

[tasks.test-diff-batch-default-contract]
root = ["cargo", "test", "-p", "hyphae", "--all-features", "--test", "cell_map_batched_diff_length", "--test", "scheduler_no_coalesce", "--", "--test-threads=1"]

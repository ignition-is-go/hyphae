[workspace]

[package]
name = "hyphae-gpui-web-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hyphae-gpui-web-smoke"
path = "main.rs"

[dependencies]
gloo-timers = "0.3"
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1" }
hyphae = { path = "../../../hyphae" }
hyphae-gpui = { path = "../.." }
web-sys = { version = "0.3", features = ["Document", "Window", "console"] }

[patch.crates-io]
hyphae = { path = "../../../hyphae" }

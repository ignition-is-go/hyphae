[package]
name = "hyphae-gpui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Event-driven adapters from hyphae cells and cell-maps to GPUI entities"
repository = "https://github.com/ignition-is-go/hyphae"
autoexamples = false

[lints]
workspace = true

[dependencies]
flume.workspace = true
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
hyphae = { version = "3.1.1" }

[dev-dependencies]
gpui = { package = "gpui-unofficial", version = "=1.16.1", features = ["test-support"] }

[package.metadata.flux]
tasks = ["fmt", "check", "check-wasm", "build", "test", "lint", "publish"]

[package]
name = "hyphae-gpui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Event-driven adapters from hyphae cells and cell-maps to GPUI entities"
repository = "https://github.com/ignition-is-go/hyphae"
autoexamples = false

[lints]
workspace = true

[dependencies]
flume.workspace = true
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "08827f9208b4848d62f3faf86ffa15155966d63c" }
hyphae = { path = "../hyphae", version = "2.0.1" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "08827f9208b4848d62f3faf86ffa15155966d63c", features = ["test-support"] }

[package.metadata.flux]
tasks = ["fmt", "check", "check-wasm", "build", "test", "lint", "publish"]

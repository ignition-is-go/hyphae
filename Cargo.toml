[workspace]
resolver = "2"
members = [
    "hyphae",
    "hyphae-leptos",
    "hyphae-gpui",
]

[workspace.package]
version = "3.1.0"
edition = "2024"
authors = ["Trevor"]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
disallowed_types = "deny"
# Panic-prone operations are forbidden across production code, tests, examples,
# and benchmarks.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
# Reactive combinators and keyed signal maps nest generics deeply; the layered
# types are the natural shape here, so don't fail the lint pipeline on them.
type_complexity = "allow"

[workspace.dependencies]
anyhow = "1.0.100"
arc-swap = "1.7.1"
crossterm = "0.28"
dashmap = "6.1.0"
flume = "0.11"
log = "0.4"
futures-core = "0.3"
parking_lot = "0.12"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "sync", "macros"] }
uuid = { version = "1.19.0", features = ["v4"] }
